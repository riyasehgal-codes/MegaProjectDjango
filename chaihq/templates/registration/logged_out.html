{% extends "layout.html" %}

{% block title %}
Logged Out | Tweetbar
{% endblock %}

{% block content %}

<style>

    /* ================================
       LOGOUT PAGE
    ================================= */

    .logout-page {
        min-height: 75vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 40px 20px;

        position: relative;
    }


    /* ================================
       DECORATIONS
    ================================= */

    .logout-decoration {
        position: absolute;

        color: #edb3c7;

        font-family: "Playfair Display", serif;

        pointer-events: none;

        opacity: 0.65;
    }

    .decoration-one {
        top: 90px;
        left: 17%;

        font-size: 2rem;

        transform: rotate(-15deg);
    }

    .decoration-two {
        bottom: 100px;
        right: 17%;

        font-size: 1.7rem;

        transform: rotate(15deg);
    }

    .decoration-three {
        top: 35%;
        right: 12%;

        font-size: 1rem;
    }


    /* ================================
       LOGOUT CARD
    ================================= */

    .logout-card {
        width: 100%;
        max-width: 450px;

        background: #fffdfc;

        border: 1px solid #efdde3;

        border-radius: 28px;

        padding: 45px 40px;

        text-align: center;

        box-shadow:
            0 20px 50px rgba(160, 100, 120, 0.10);

        position: relative;

        overflow: hidden;
    }


    /* Pink top accent */

    .logout-card::before {
        content: "";

        position: absolute;

        top: 0;
        left: 0;

        width: 100%;
        height: 4px;

        background: #e889aa;
    }


    /* ================================
       ICON
    ================================= */

    .logout-icon {
        width: 65px;
        height: 65px;

        margin: 0 auto 18px;

        border-radius: 50%;

        background: #ffe8f0;

        color: #d95f8c;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 1.8rem;
    }


    /* ================================
       TEXT
    ================================= */

    .logout-title {
        font-family: "Playfair Display", serif;

        color: #5b414b;

        font-size: 2rem;

        font-weight: 700;

        margin-bottom: 8px;
    }

    .logout-message {
        color: #9a7f88;

        font-size: 0.9rem;

        line-height: 1.6;

        margin-bottom: 28px;
    }


    /* ================================
       LOGIN BUTTON
    ================================= */

    .login-again-btn {
        display: inline-flex;

        align-items: center;
        justify-content: center;

        background: #df6d98;

        color: white !important;

        padding: 11px 28px;

        border-radius: 50px;

        font-size: 0.9rem;

        font-weight: 700;

        box-shadow:
            0 6px 18px rgba(223, 109, 152, 0.18);

        transition: all 0.2s ease;
    }

    .login-again-btn:hover {
        background: #cf5b87;

        color: white !important;

        transform: translateY(-1px);

        box-shadow:
            0 8px 22px rgba(223, 109, 152, 0.25);
    }


    /* ================================
       HOME LINK
    ================================= */

    .home-link {
        display: block;

        margin-top: 18px;

        color: #a1818c;

        font-size: 0.82rem;

        font-weight: 600;

        transition: 0.2s ease;
    }

    .home-link:hover {
        color: #d95f8c;
    }


    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 576px) {

        .logout-card {
            padding: 35px 25px;

            border-radius: 22px;
        }

        .logout-title {
            font-size: 1.75rem;
        }

        .decoration-one,
        .decoration-two,
        .decoration-three {
            display: none;
        }

    }

</style>


<div class="logout-page">


    <!-- Decorations -->

    <div class="logout-decoration decoration-one">
        ♡
    </div>

    <div class="logout-decoration decoration-two">
        ♡
    </div>

    <div class="logout-decoration decoration-three">
        ✦
    </div>


    <!-- Logout Card -->

    <div class="logout-card">


        <!-- Icon -->

        <div class="logout-icon">
            ♡
        </div>


        <!-- Heading -->

        <h1 class="logout-title">
            See you soon!
        </h1>


        <!-- Message -->

        <p class="logout-message">
            You've been logged out of Tweetbar.
            <br>
            Your little thoughts will be waiting for you.
        </p>


        <!-- Login Again -->

        <a
            href="{% url 'login' %}"
            class="login-again-btn"
        >
            Login again ♡
        </a>


        <!-- Home -->

        <a
            href="{% url 'tweet_list' %}"
            class="home-link"
        >
            ← Back to Tweetbar
        </a>


    </div>

</div>

{% endblock %}
