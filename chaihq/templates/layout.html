{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <title>{% block title %}Tweetbar{% endblock %}</title>


    <style>

        /* =========================================
           GLOBAL
        ========================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff7fa !important;
            color: #493740 !important;
            font-family: "DM Sans", sans-serif;
        }

        a {
            text-decoration: none;
        }


        /* =========================================
           NAVBAR
        ========================================= */

        .navbar-custom {
            background: rgba(255, 250, 248, 0.97);
            border-bottom: 1px solid #f0dfe3;

            padding: 13px 0;

            box-shadow:
                0 4px 20px rgba(190, 130, 150, 0.08);

            position: relative;
            z-index: 1000;
        }


        /* =========================================
           LOGO
        ========================================= */

        .tweetbar-logo {
            display: inline-flex;
            align-items: center;

            font-family: "Playfair Display", serif;

            font-size: 1.65rem;
            font-weight: 700;

            color: #d95f8c !important;

            letter-spacing: -0.5px;

            padding: 7px 13px;

            border-radius: 14px;

            transition: all 0.25s ease;
        }

        .tweetbar-logo:hover {
            color: #c94d7d !important;

            background: #fff0f5;

            transform: translateY(-1px);
        }


        /* =========================================
           NAVIGATION LINKS
        ========================================= */

        .navbar-nav {
            gap: 3px;
        }

        .navbar-custom .nav-link {
            color: #765e67 !important;

            font-size: 0.9rem;
            font-weight: 600;

            padding: 9px 15px !important;

            margin: 0 2px;

            border-radius: 50px;

            transition: all 0.25s ease;
        }

        .navbar-custom .nav-link:hover {
            color: #d95f8c !important;

            background: #fff0f5;

            transform: translateY(-1px);
        }

        .navbar-custom .nav-link.active {
            color: #d95f8c !important;

            background: #ffe9f0;
        }


        /* =========================================
           SEARCH BAR
        ========================================= */

        .search-wrapper {
            position: relative;

            margin-right: 12px;
        }

        .search-box {
            width: 220px;
            height: 40px;

            padding: 8px 45px 8px 17px;

            background: #fff7f8 !important;

            border: 1px solid #ecd7dd !important;

            border-radius: 50px;

            color: #5b454e !important;

            font-size: 0.86rem;

            transition: all 0.25s ease;
        }

        .search-box::placeholder {
            color: #ae969e;
        }

        .search-box:hover {
            border-color: #e7bdca !important;
        }

        .search-box:focus {
            background: #ffffff !important;

            border-color: #e68aaa !important;

            color: #5b454e !important;

            box-shadow:
                0 0 0 3px rgba(230, 138, 170, 0.12) !important;

            outline: none;
        }


        /* Search circular button */

        .search-button {
            position: absolute;

            right: 4px;
            top: 4px;

            width: 32px;
            height: 32px;

            border: none;
            border-radius: 50%;

            background: #f28caf;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 1rem;

            cursor: pointer;

            transition: all 0.2s ease;
        }

        .search-button:hover {
            background: #d95f8c;

            transform: scale(1.06);
        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            color: #d95f8c !important;

            border: 1px solid #e9a5ba;

            background: #ffffff;

            padding: 8px 17px;

            border-radius: 50px;

            font-size: 0.86rem;
            font-weight: 600;

            transition: all 0.2s ease;
        }

        .login-btn:hover {
            background: #fff0f5;

            border-color: #d95f8c;

            color: #c94d7d !important;

            transform: translateY(-1px);
        }


        /* =========================================
           SIGN UP BUTTON
        ========================================= */

        .signup-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            color: white !important;

            background: #df6d98;

            padding: 9px 19px;

            border-radius: 50px;

            font-size: 0.86rem;
            font-weight: 700;

            box-shadow:
                0 5px 15px rgba(223, 109, 152, 0.18);

            transition: all 0.2s ease;
        }

        .signup-btn:hover {
            background: #cc5985;

            color: white !important;

            transform: translateY(-1px);

            box-shadow:
                0 7px 18px rgba(223, 109, 152, 0.25);
        }


        /* =========================================
           PROFILE BUTTON
        ========================================= */

        .profile-button {
            background: #fff7f8;

            border: 1px solid #ecd7dd;

            color: #765e67;

            border-radius: 50px;

            padding: 5px 12px 5px 6px;

            display: flex;
            align-items: center;

            gap: 7px;

            font-weight: 600;

            transition: all 0.2s ease;
        }

        .profile-button:hover {
            border-color: #e68aaa;

            color: #d95f8c;

            background: #fff0f5;
        }


        /* Profile circle */

        .profile-avatar {
            width: 30px;
            height: 30px;

            border-radius: 50%;

            background: #ffdce8;

            color: #c94d7d;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 0.75rem;

            font-weight: 700;
        }


        /* =========================================
           DROPDOWN
        ========================================= */

        .dropdown-menu {
            background: #fffaf9;

            border: 1px solid #efdde2;

            border-radius: 16px;

            padding: 7px;

            margin-top: 10px !important;

            box-shadow:
                0 15px 35px rgba(130, 80, 100, 0.12);
        }

        .dropdown-item {
            color: #765e67;

            border-radius: 10px;

            padding: 9px 13px;

            font-size: 0.86rem;

            transition: all 0.2s ease;
        }

        .dropdown-item:hover {
            background: #fff0f5;

            color: #d95f8c;
        }

        .dropdown-divider {
            border-color: #f0dfe3;
        }


        /* =========================================
           MOBILE TOGGLE
        ========================================= */

        .navbar-toggler {
            border: 1px solid #e8cbd4;

            border-radius: 10px;

            padding: 6px 9px;
        }

        .navbar-toggler:focus {
            box-shadow:
                0 0 0 3px rgba(230, 138, 170, 0.12);
        }

        .navbar-toggler-icon {
            filter: none;
        }


        /* =========================================
           PAGE CONTENT
        ========================================= */

        .page-container {
            min-height: calc(100vh - 72px);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 991px) {

            .navbar-nav {
                margin-top: 12px;
            }

            .search-wrapper {
                margin: 15px 0 10px;

                width: 100%;
            }

            .search-box {
                width: 100%;
            }

            .login-btn,
            .signup-btn {
                margin-top: 6px;
            }

        }
        .navbar-username {
    color: #6d4d58;
    font-size: 14px;
    font-weight: 600;
    margin-right: 8px;
}

.nav-auth {
    text-decoration: none;
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    transition: 0.2s ease;
}

.login-btn {
    color: #6d4d58;
    border: 1px solid #e8cfd8;
    background: #fffaf8;
}

.login-btn:hover {
    background: #fdf0f4;
    color: #d45f8b;
}

.register-btn {
    background: #df6d98;
    color: white;
}

.register-btn:hover {
    background: #cc5d87;
    color: white;
    transform: translateY(-1px);
}

.logout-btn {
    background: #fff0f4;
    color: #c75b76;
    border: 1px solid #efd4dc;
}

.logout-btn:hover {
    background: #f8dfe7;
    color: #b84e6b;
}

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar navbar-expand-lg navbar-custom">

        <div class="container-fluid px-4">


            <!-- LOGO -->

            <a class="tweetbar-logo" href="/">
                ♡ Tweetbar
            </a>


            <!-- MOBILE MENU BUTTON -->

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>


            <!-- NAVBAR CONTENT -->

            <div
                class="collapse navbar-collapse"
                id="navbarContent"
            >


                <!-- =================================
                     LEFT NAVIGATION
                ================================= -->

                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">


                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="/"
                        >
                            Home
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="#"
                        >
                            Explore
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="#"
                        >
                            Trending
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="#"
                        >
                            About
                        </a>

                    </li>


                </ul>


                <!-- =================================
                     RIGHT SIDE
                ================================= -->

                <div class="d-flex align-items-center flex-wrap">


                    <!-- SEARCH -->

                    <form
                        class="search-wrapper"
                        role="search"
                    >

                        <input
                            class="form-control search-box"
                            type="search"
                            placeholder="Search tweets..."
                            aria-label="Search"
                        >

                        <button
                            class="search-button"
                            type="submit"
                            aria-label="Search"
                        >
                            ⌕
                        </button>

                    </form>


                    <!-- LOGIN -->

                    <div class="d-flex align-items-center gap-2">

                    {% if user.is_authenticated %}

                        <span class="navbar-username">
                            Hi, {{ user.username }} ♡
                        </span>

                        <form method="POST" action="{% url 'logout' %}" style="display: inline;">
                            {% csrf_token %}
                            <button type="submit" class="nav-auth logout-btn">
                                Logout
                            </button>
                        </form>

                    {% else %}

                        <a href="{% url 'login' %}" class="nav-auth login-btn">
                            Login
                        </a>

                        <a href="{% url 'register' %}" class="nav-auth register-btn">
                            Register ♡
                        </a>

                    {% endif %}

                </div>


                </div>

            </div>

        </div>

    </nav>


    <!-- =========================================
         PAGE CONTENT
    ========================================= -->

    <main class="page-container">

        <div class="container py-5">

            {% block content %}
            {% endblock %}

        </div>

    </main>


    <!-- =========================================
         BOOTSTRAP JAVASCRIPT
    ========================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
